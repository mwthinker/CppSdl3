name: CI
on:
  push:
  pull_request:

jobs:
  job:
    name: ${{ matrix.os }}-${{ github.workflow }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            preset: 'windows'
          - os: ubuntu-latest
            preset: 'unix'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.2

      - name: Set C++ VCPKG_ROOT
        shell: bash
        run: echo VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"; cat "$GITHUB_ENV"

      - name: Tool versions
        shell: bash
        run: |
          g++ --version
          make --version
        if: runner.os == 'Linux'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libltdl-dev libx11-dev libxft-dev libxext-dev autoconf autoconf-archive automake libtool
        if: runner.os == 'Linux'

      - name: Run CMake
        shell: bash
        run: |
          cmake --preset=${{ matrix.preset }} -B build_debug -DCppSdl3_Test=1 -DCppSdl3_Example=1 -DCMAKE_VERBOSE_MAKEFILE=1 -DCMAKE_BUILD_TYPE=Debug
          cmake --preset=${{ matrix.preset }} -B build_release -DCppSdl3_Test=1 -DCppSdl3_Example=1 -DCMAKE_VERBOSE_MAKEFILE=1 -DCMAKE_BUILD_TYPE=Release

      - name: Compile binaries
        shell: bash
        run: |
          cmake --build build_debug --config Debug
          cmake --build build_release --config Release

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir build_debug --build-config Debug --output-on-failure
          ctest --test-dir build_release --build-config Release --output-on-failure
